name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-tests:
    name: Ubuntu 24.04 source and theme tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      NO_AT_BRIDGE: "1"
      DISPLAY: ""
      WAYLAND_DISPLAY: ""
      HYPRLAND_INSTANCE_SIGNATURE: ""
      XDG_CONFIG_HOME: ${{ runner.temp }}/rglauncher-ci/config
      XDG_DATA_HOME: ${{ runner.temp }}/rglauncher-ci/data
      XDG_STATE_HOME: ${{ runner.temp }}/rglauncher-ci/state
      XDG_RUNTIME_DIR: ${{ runner.temp }}/rglauncher-ci/runtime
    steps:
      - name: Check out reviewed source
        # actions/checkout v7.0.1, resolved through its official GitHub API tag.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Ubuntu test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            python3 python3-gi python3-gi-cairo python3-cairo \
            python3-numpy python3-cryptography \
            gir1.2-glib-2.0 gir1.2-gtk-3.0 gir1.2-gtk-4.0 \
            desktop-file-utils lua5.4
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

      - name: Run isolated core source tests
        run: /usr/bin/python3 -B -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build the data-only editor extension
        run: /usr/bin/python3 -B vscode/build.py --icons-source assets/icons

      - name: Run editor theme and archive tests
        run: /usr/bin/python3 -B -m unittest discover -s vscode/tests -p 'test_*.py' -v

      # Native compositor/menu/render fixtures are deliberately opt-in. This
      # workflow has no publishing credentials, signing step or release upload.
